<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!--
  Theme-adaptive favicon. Two renderings of the mark, inverses of each other,
  switched on the OS colour scheme. The disc always OPPOSES its background - a
  light tab strip gets the black disc, a dark strip the white one - so the coin
  reads at 16px instead of dissolving into the strip.

  This file answers the OS only. FaviconTheme.tsx additionally repoints the icon
  link at /favicon-light.svg or /favicon-dark.svg when someone flips our own
  light/dark switch, so the toggle drives the tab too. Both paths must stay in
  agreement about which art goes with which theme.

  The dark-theme image carries display="none" as a PRESENTATION ATTRIBUTE, which
  any CSS rule outranks - so a renderer that ignores <style> draws the light-theme
  mark rather than stacking both. display toggling rather than filter:invert(1):
  SVG favicons render in a restricted image context and the feature shouldn't
  rest on filter support there.

  Safari renders no SVG favicon at all and falls back to favicon.ico.
  Generated by scripts - do not hand-edit the payloads.
-->
<style>@media (prefers-color-scheme: dark){#lt{display:none}#dk{display:inline}}</style>
<image id="lt" width="128" height="128" href="data:image/png;base64,"/>
<image id="dk" display="none" width="128" height="128" href="data:image/png;base64,"/>
</svg>
